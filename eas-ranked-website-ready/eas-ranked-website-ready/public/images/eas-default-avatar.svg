<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="#0d1b2a"/>
  <!-- Subtle gradient overlay -->
  <circle cx="128" cy="128" r="128" fill="url(#grad)"/>
  <!-- Person silhouette -->
  <circle cx="128" cy="96" r="40" fill="rgba(0,207,255,0.35)"/>
  <ellipse cx="128" cy="200" rx="64" ry="48" fill="rgba(0,207,255,0.25)"/>
  <!-- Ring -->
  <circle cx="128" cy="128" r="124" stroke="rgba(0,207,255,0.2)" stroke-width="2" fill="none"/>
  <defs>
    <radialGradient id="grad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(0,207,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(6,43,69,0)"/>
    </radialGradient>
  </defs>
</svg>
